<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peb Tsev Neeg Hmoob Xyooj</title>
    <link rel="stylesheet" href="dashboard-stype.css">
</head>

<body>

    <!-- Header ส่วนหัว -->
    <header>
        <h1>Peb Tsev Neeg Hmoob Xyooj</h1>
    </header>

    <!-- Navigation เมนู -->
    <nav>
        <ul>
            <li><a href="dashboard.html">🏠 Home</a></li>
            <li><a href="index.html">ℹ️ About</a></li>
            <li><a href="setting.html">⚙️ Setting</a></li>
        </ul>
    </nav>

    <!-- Main ส่วนเนื้อหาผังตระกูลตรงกลาง -->
    <main>
        <div id="tree-container">
            <p style="text-align: center; color: #fff; padding: 20px;">กำลังโหลดข้อมูลตระกูล...</p>
        </div>
    </main>

    <!-- Modal ป๊อปอัพแสดงประวัติ -->
    <div id="bio-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="close-modal">&times;</span>
            <img id="modal-img" class="modal-img" src="" alt="Tso daim duab">
            <h2 id="modal-name" style="text-align: center; margin: 5px 0;"></h2>
            <p id="modal-role" style="text-align: center; color: #7f8c8d; font-size: 0.9rem;"></p>
            <hr style="margin: 10px 0;">
            <h4>📖 keeb kwm yav dhau los:</h4>
            <p id="modal-bio" style="line-height: 1.6; color: #444; margin-top: 5px;"></p>
            <div id="modal-link-container" style="text-align: center; margin-top: 15px;"></div>
        </div>
    </div>

    <!-- Footer ส่วนท้าย -->
    <footer>
        <p>&copy; 2026 สงวนลิขสิทธิ์</p>
        <p>version 1.1: Hmong News</p>
        <p>WhatsApp: 02098614336</p>
        <p>Hu tus xov tooj: 02091981945</p>
    </footer>

    <!-- Firebase Script สำหรับดึงข้อมูลจาก Database -->
    <script type="module">
        import {initializeApp} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import {getDatabase, ref, onValue} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDCE_qqKanTTdVXYwBMBIfPu0M0Xy-kbX8",
            authDomain: "hujai-web.firebaseapp.com",
            databaseURL: "https://hujai-web-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "hujai-web",
            storageBucket: "hujai-web.firebasestorage.app",
            messagingSenderId: "827968973337",
            appId: "1:827968973337:web:ae6ef630b59cf429575888",
            measurementId: "G-XCF3TBNG8L"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const dbRef = ref(db, 'familyMembers');

        const treeContainer = document.getElementById('tree-container');
        const modal = document.getElementById('bio-modal');
        const closeModal = document.getElementById('close-modal');

        // ดึงข้อมูล Realtime จาก Firebase
        onValue(dbRef, (snapshot) => {
            const data = snapshot.val();
            if (!data) {
                treeContainer.innerHTML = '<p style="text-align: center; color: #fff; padding: 20px;">ยังไม่มีข้อมูลในระบบ กรุณาเพิ่มข้อมูลที่หน้า Setting</p>';
                return;
            }

            // แปลง Object จาก Firebase เป็น Array
            const familyData = Object.values(data);
            renderTree(familyData);
        });

        // ฟังก์ชันจัดกลุ่มตามรุ่น และแสดงผลการ์ด
        function renderTree(familyData) {
            treeContainer.innerHTML = '';
            const groupedData = {};

            // จัดกลุ่มตาม generation
            familyData.forEach(item => {
                const genKey = item.generation || 99;
                if (!groupedData[genKey]) {
                    groupedData[genKey] = {
                        title: item.genTitle || `รุ่นที่ ${genKey}`,
                        members: []
                    };
                }
                groupedData[genKey].members.push(item);
            });

            // เรียงลำดับรุ่นจากน้อยไปมาก (รุ่น 1, 2, 3...)
            const sortedKeys = Object.keys(groupedData).sort((a, b) => a - b);

            sortedKeys.forEach(genKey => {
                const genGroup = groupedData[genKey];

                const rowDiv = document.createElement('div');
                rowDiv.className = 'generation-row';

                const titleDiv = document.createElement('div');
                titleDiv.className = 'generation-title';
                titleDiv.innerText = genGroup.title;
                rowDiv.appendChild(titleDiv);

                genGroup.members.forEach(member => {
                    const card = document.createElement('div');
                    card.className = 'member-card';
                    card.innerHTML = `
                        <img src="${member.photoUrl || 'https://via.placeholder.com/100'}" class="member-img" alt="${member.name}">
                        <div class="member-name">${member.name}</div>
                        <div class="member-role">${member.role}</div>
                    `;

                    // เมื่อกดที่การ์ดจะแสดง Pop-up Modal
                    card.addEventListener('click', () => {
                        document.getElementById('modal-img').src = member.photoUrl || 'https://via.placeholder.com/100';
                        document.getElementById('modal-name').innerText = member.name;
                        document.getElementById('modal-role').innerText = member.role;
                        document.getElementById('modal-bio').innerText = member.bio;

                        const linkContainer = document.getElementById('modal-link-container');
                        if (member.storyUrl) {
                            linkContainer.innerHTML = `<a href="${member.storyUrl}" target="_blank" style="display:inline-block; padding:8px 16px; background:#1abc9c; color:white; text-decoration:none; border-radius:6px; font-size:0.9rem;">📖 อ่านเรื่องราวเต็ม (.html)</a>`;
                        } else {
                            linkContainer.innerHTML = '';
                        }

                        modal.style.display = 'flex';
                    });

                    rowDiv.appendChild(card);
                });

                treeContainer.appendChild(rowDiv);
            });
        }

        // ปิด Modal
        closeModal.addEventListener('click', () => modal.style.display = 'none');
        window.addEventListener('click', (e) => {
            if (e.target === modal) modal.style.display = 'none';
        });
    </script>

    <!-- ลิงก์ดึงไฟล์ป้องกันการเปิดดูโค้ดมาใช้งาน -->
    <script src="protect.js"></script>
</body>

</html>
