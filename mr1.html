<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>จัดการประวัติส่วนตัว - Peb Tsev Neeg Hmoob Xyooj</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Sarabun', sans-serif;
            background: linear-gradient(135deg, #1a1c29 0%, #2f4050 100%);
            color: #333;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 30px 15px;
        }

        .container {
            background: #ffffff;
            width: 100%;
            max-width: 650px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        /* ส่วนหัว */
        .header {
            background-color: #2f4050;
            color: #ffffff;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .btn-back {
            color: #ffffff;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.15);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.9rem;
            transition: 0.3s;
        }

        .btn-back:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .form-body {
            padding: 25px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-weight: 500;
            margin-bottom: 5px;
            color: #2f4050;
            font-size: 0.9rem;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1.5px solid #e0e0e0;
            border-radius: 8px;
            font-size: 0.95rem;
            font-family: inherit;
            outline: none;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #1abc9c;
        }

        .preview-container {
            text-align: center;
            margin-bottom: 12px;
        }

        .profile-preview {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #1abc9c;
        }

        /* ปุ่มกด */
        .btn-action {
            display: flex;
            gap: 10px;
        }

        .btn-save {
            flex: 2;
            background: #1abc9c;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-save:hover {
            background: #16a085;
        }

        .btn-cancel-edit {
            flex: 1;
            background: #e74c3c;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            display: none;
        }

        /* ส่วนแสดงรายการด้านล่าง */
        .list-section {
            background: #f8f9fa;
            padding: 25px;
            border-top: 2px dashed #e0e0e0;
        }

        .list-title {
            font-size: 1.1rem;
            color: #2f4050;
            font-weight: 600;
            margin-bottom: 15px;
            text-align: center;
        }

        .item-card {
            background: #ffffff;
            border-radius: 10px;
            padding: 12px 15px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            transition: 0.2s;
        }

        .item-card:hover {
            transform: translateY(-2px);
        }

        .item-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .item-img {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #1abc9c;
        }

        .item-name {
            font-weight: 600;
            font-size: 0.95rem;
            color: #2c3e50;
        }

        .item-role {
            font-size: 0.8rem;
            color: #7f8c8d;
        }

        .item-btns {
            display: flex;
            gap: 6px;
        }

        .btn-sm {
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            color: white;
        }

        .btn-read {
            background: #3498db;
        }

        .btn-edit {
            background: #f39c12;
        }

        .btn-del {
            background: #e74c3c;
        }

        /* Modal แจ้งเตือน และ Modal อ่านประวัติ */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .modal-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            max-width: 380px;
            width: 90%;
            animation: popup 0.3s ease-out;
        }

        @keyframes popup {
            0% {
                transform: scale(0.7);
                opacity: 0;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .modal-link {
            display: inline-block;
            margin-top: 15px;
            padding: 8px 16px;
            background: #1abc9c;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 0.85rem;
        }
    </style>
</head>

<body>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <a href="setting.html" class="btn-back">⬅️ ย้อนกลับ</a>
            <h2>📝 พิมพ์ประวัติส่วนตัว</h2>
            <div style="width: 70px;"></div>
        </div>

        <!-- ฟอร์มกรอกข้อมูล -->
        <div class="form-body">
            <form id="profileForm">
                <input type="hidden" id="editKey">

                <div class="preview-container">
                    <img id="avatarPreview" src="Images/1.jpg" class="profile-preview"
                        alt="ตัวอย่างรูป">
                </div>

                <div class="form-group">
                    <label>ถ่ายรูป/เลือกรูปโปรไฟล์:</label>
                    <input type="file" id="photoInput" accept="image/*">
                    <input type="hidden" id="photoBase64">
                </div>

                <div class="form-group">
                    <label>เลือกรุ่น:</label>
                    <select id="genSelect" required>
                        <option value="1">รุ่นที่ 1 : ปู่ย่า - ตาแอด</option>
                        <option value="2">รุ่นที่ 2 : พ่อแม่ - ลุงป้าน้าอา</option>
                        <option value="3" selected>รุ่นที่ 3 : ลูกหลาน / เพื่อนๆ</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>ชื่อ - นามสกุล:</label>
                    <input type="text" id="nameInput" placeholder="พิมพ์ชื่อ-นามสกุล" required>
                </div>

                <div class="form-group">
                    <label>ตำแหน่ง/สถานะ:</label>
                    <input type="text" id="roleInput" placeholder="เช่น ลูกชายคนโต / เพื่อนสนิท" required>
                </div>

                <div class="form-group">
                    <label>ประวัติย่อ / เรื่องราวส่วนตัว:</label>
                    <textarea id="bioInput" rows="3" placeholder="พิมพ์เรื่องราวของคุณที่นี่..." required></textarea>
                </div>

                <div class="form-group">
                    <label>ชื่อไฟล์หน้าอ่านเรื่องราว (.html):</label>
                    <input type="text" id="storyInput" placeholder="เช่น my-story.html">
                </div>

                <div class="btn-action">
                    <button type="submit" class="btn-save" id="btnSave">💾 บันทึกข้อมูล</button>
                    <button type="button" class="btn-cancel-edit" id="btnCancel">ยกเลิก</button>
                </div>
            </form>
        </div>

        <!-- รายการประวัติที่บันทึกแล้ว -->
        <div class="list-section">
            <div class="list-title">📋 รายการประวัติทั้งหมด</div>
            <div id="dataList">กำลังโหลดข้อมูล...</div>
        </div>
    </div>

    <!-- UI แจ้งเตือนป๊อปอัพตรงกลาง -->
    <div id="alertModal" class="modal">
        <div class="modal-card">
            <div id="alertIcon" style="font-size:40px; margin-bottom:10px;">✅</div>
            <div id="alertTitle" style="font-size:1.1rem; font-weight:bold; color:#2f4050;"></div>
            <div id="alertMsg" style="font-size:0.9rem; color:#666; margin: 8px 0 18px 0;"></div>
            <button id="btnAlertClose"
                style="background:#2f4050; color:white; border:none; padding:8px 20px; border-radius:6px; cursor:pointer;">ตกลง</button>
        </div>
    </div>

    <!-- UI Modal กดอ่านประวัติ -->
    <div id="readModal" class="modal">
        <div class="modal-card" style="text-align: left; max-width: 450px;">
            <div style="text-align: center; margin-bottom: 10px;">
                <img id="readImg" src=""
                    style="width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 2px solid #1abc9c;">
                <h3 id="readName" style="color: #2f4050; margin-top: 5px;"></h3>
                <p id="readRole" style="font-size: 0.85rem; color: #7f8c8d;"></p>
            </div>
            <hr style="border: 0; border-top: 1px solid #eee; margin: 10px 0;">
            <p id="readBio"
                style="font-size: 0.95rem; line-height: 1.5; color: #444; max-height: 200px; overflow-y: auto;"></p>
            <div id="readLinkContainer" style="text-align: center;"></div>
            <button id="btnReadClose"
                style="width: 100%; margin-top: 15px; background:#e74c3c; color:white; border:none; padding:8px; border-radius:6px; cursor:pointer;">ปิดหน้าต่าง</button>
        </div>
    </div>

    <!-- Firebase Code -->
    <script type="module">
        import {initializeApp} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import {getDatabase, ref, push, set, onValue, remove} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDCE_qqKanTTdVXYwBMBIfPu0M0Xy-kbX8",
            authDomain: "hujai-web.firebaseapp.com",
            databaseURL: "https://hujai-web-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "hujai-web",
            storageBucket: "hujai-web.firebasestorage.app",
            messagingSenderId: "827968973337",
            appId: "1:827968973337:web:ae6ef630b59cf429575888",
            measurementId: "G-XCF3TBNG8L"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const dbRef = ref(db, 'familyMembers');

        let cacheData = {};

        // 1. ระบบจัดการรูปภาพภาพ
        document.getElementById('photoInput').addEventListener('change', function (e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function (event) {
                    const img = new Image();
                    img.onload = function () {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        const maxSize = 200;
                        let width = img.width, height = img.height;

                        if (width > height) {if (width > maxSize) {height *= maxSize / width; width = maxSize;} }
                        else {if (height > maxSize) {width *= maxSize / height; height = maxSize;} }

                        canvas.width = width; canvas.height = height;
                        ctx.drawImage(img, 0, 0, width, height);

                        const base64Image = canvas.toDataURL('image/jpeg', 0.7);
                        document.getElementById('photoBase64').value = base64Image;
                        document.getElementById('avatarPreview').src = base64Image;
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        // 2. ดึงข้อมูลจาก Firebase มาแสดงผล Real-time
        onValue(dbRef, (snapshot) => {
            cacheData = snapshot.val() || {};
            renderList(cacheData);
        });

        // 3. แสดงผลรายการประวัติ
        function renderList(data) {
            const listContainer = document.getElementById('dataList');
            listContainer.innerHTML = '';

            const keys = Object.keys(data);
            if (keys.length === 0) {
                listContainer.innerHTML = '<p style="text-align:center; color:#888; font-size:0.9rem;">ยังไม่มีข้อมูลประวัติในระบบ</p>';
                return;
            }

            keys.forEach(key => {
                const item = data[key];
                const card = document.createElement('div');
                card.className = 'item-card';
                card.innerHTML = `
                    <div class="item-info">
                        <img src="${item.photoUrl}" class="item-img">
                        <div>
                            <div class="item-name">${item.name}</div>
                            <div class="item-role">${item.role}</div>
                        </div>
                    </div>
                    <div class="item-btns">
                        <button class="btn-sm btn-read" onclick="readItem('${key}')">อ่าน</button>
                        <button class="btn-sm btn-edit" onclick="editItem('${key}')">แก้ไข</button>
                        <button class="btn-sm btn-del" onclick="deleteItem('${key}')">ลบ</button>
                    </div>
                `;
                listContainer.appendChild(card);
            });
        }

        // 4. บันทึก / แก้ไขข้อมูล
        document.getElementById('profileForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const editKey = document.getElementById('editKey').value;
            const genSelect = document.getElementById('genSelect');
            const photoVal = document.getElementById('photoBase64').value || 'https://via.placeholder.com/100';

            const payload = {
                generation: parseInt(genSelect.value),
                genTitle: genSelect.options[genSelect.selectedIndex].text,
                name: document.getElementById('nameInput').value,
                role: document.getElementById('roleInput').value,
                bio: document.getElementById('bioInput').value,
                storyUrl: document.getElementById('storyInput').value || '',
                photoUrl: photoVal
            };

            if (editKey) {
                // แก้ไขรายการเดิม
                set(ref(db, 'familyMembers/' + editKey), payload)
                    .then(() => {
                        showAlert('✅', 'อัปเดตสำเร็จ!', 'แก้ไขข้อมูลประวัติเรียบร้อยแล้ว');
                        resetForm();
                    })
                    .catch(err => showAlert('❌', 'เกิดข้อผิดพลาด!', err.message));
            } else {
                // เพิ่มรายการใหม่
                push(dbRef, payload)
                    .then(() => {
                        showAlert('✅', 'บันทึกสำเร็จ!', 'เพิ่มประวัติของคุณลงในฐานข้อมูลแล้ว');
                        resetForm();
                    })
                    .catch(err => showAlert('❌', 'เกิดข้อผิดพลาด!', err.message));
            }
        });

        // ฟังก์ชันอ่านประวัติ
        window.readItem = function (key) {
            const item = cacheData[key];
            if (!item) return;

            document.getElementById('readImg').src = item.photoUrl;
            document.getElementById('readName').innerText = item.name;
            document.getElementById('readRole').innerText = item.role;
            document.getElementById('readBio').innerText = item.bio;

            const linkContainer = document.getElementById('readLinkContainer');
            if (item.storyUrl) {
                linkContainer.innerHTML = `<a href="${item.storyUrl}" class="modal-link">📖 ไปยังหน้าเรื่องราว (.html)</a>`;
            } else {
                linkContainer.innerHTML = '';
            }

            document.getElementById('readModal').style.display = 'flex';
        };

        // ฟังก์ชันดึงกลับมาแก้ไข
        window.editItem = function (key) {
            const item = cacheData[key];
            if (!item) return;

            document.getElementById('editKey').value = key;
            document.getElementById('genSelect').value = item.generation;
            document.getElementById('nameInput').value = item.name;
            document.getElementById('roleInput').value = item.role;
            document.getElementById('bioInput').value = item.bio;
            document.getElementById('storyInput').value = item.storyUrl || '';
            document.getElementById('photoBase64').value = item.photoUrl;
            document.getElementById('avatarPreview').src = item.photoUrl;

            document.getElementById('btnSave').innerText = '🔄 อัปเดตข้อมูล';
            document.getElementById('btnCancel').style.display = 'block';

            window.scrollTo({top: 0, behavior: 'smooth'});
        };

        // ฟังก์ชันลบข้อมูลออกจาก Firebase
        window.deleteItem = function (key) {
            if (confirm('คุณแน่ใจหรือไม่ว่าต้องการลบประวัตินี้ออกจากฐานข้อมูล?')) {
                remove(ref(db, 'familyMembers/' + key))
                    .then(() => showAlert('🗑️', 'ลบข้อมูลสำเร็จ', 'ข้อมูลถูกลบออกจาก Firebase เรียบร้อยแล้ว'))
                    .catch(err => showAlert('❌', 'เกิดข้อผิดพลาด!', err.message));
            }
        };

        // รีเซ็ตฟอร์ม
        document.getElementById('btnCancel').addEventListener('click', resetForm);

        function resetForm() {
            document.getElementById('profileForm').reset();
            document.getElementById('editKey').value = '';
            document.getElementById('photoBase64').value = '';
            document.getElementById('avatarPreview').src = 'https://via.placeholder.com/100';
            document.getElementById('btnSave').innerText = '💾 บันทึกข้อมูล';
            document.getElementById('btnCancel').style.display = 'none';
        }

        // แจ้งเตือน & Modal Control
        function showAlert(icon, title, msg) {
            document.getElementById('alertIcon').innerText = icon;
            document.getElementById('alertTitle').innerText = title;
            document.getElementById('alertMsg').innerText = msg;
            document.getElementById('alertModal').style.display = 'flex';
        }

        document.getElementById('btnAlertClose').addEventListener('click', () => {
            document.getElementById('alertModal').style.display = 'none';
        });

        document.getElementById('btnReadClose').addEventListener('click', () => {
            document.getElementById('readModal').style.display = 'none';
        });
    </script>

    


    <!-- ลิงก์ดึงไฟล์ป้องกันการเปิดดูโค้ดมาใช้งาน -->
    <script src="protect.js"></script>
</body>

</html>
